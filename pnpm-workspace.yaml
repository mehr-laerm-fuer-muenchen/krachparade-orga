allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

# Security fix (GHSA-67mh-4wv8-2f99): drizzle-kit still pulls esbuild 0.18
# through the deprecated @esbuild-kit packages. Remove once drizzle-kit
# drops @esbuild-kit.
overrides:
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"

patchedDependencies:
  drizzle-kit@0.31.11: patches/drizzle-kit@0.31.11.patch
