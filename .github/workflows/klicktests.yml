name: Klicktests

# Runs the Playwright smoke tests (e2e/) for the PR's head commit, on one of
# two paths (spec 019):
# - "Vorschau": the head commit's author is Franz or a bot → wait for the
#   Vercel preview and test against it. No preview after 10 minutes → the
#   check fails (a skipped required job would count as passed).
# - "Selbstbau": anyone else. Vercel Hobby does not deploy commits of authors
#   outside the Vercel team, so the job builds the app itself and tests
#   against it on port 3100.
# Both paths stay inside the one job "Klicktests" (required check).

on:
  pull_request:
    branches: [main]

# A new push to the same PR replaces the older run.
concurrency:
  group: klicktests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  klicktests:
    name: Klicktests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # All previews and self-builds share the Neon branch `dev`: never two
    # runs at once.
    concurrency:
      group: dev-datenbank
      cancel-in-progress: false
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Decided by the GitHub login of the head commit's author, never by an
      # e-mail address. No linked account (login empty) → Selbstbau.
      - name: Weg wählen (Vorschau oder Selbstbau)
        id: weg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          autor=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" \
            --jq '[(.author.login // ""), (.author.type // "")] | @tsv')
          login=$(printf '%s' "$autor" | cut -f1)
          typ=$(printf '%s' "$autor" | cut -f2)
          if [ "$login" = "dellingerfranz-dev" ] || [ "$typ" = "Bot" ]; then
            weg=vorschau
            text="Vorschau"
          else
            weg=selbstbau
            text="Selbstbau, Autor nicht im Vercel-Team"
          fi
          echo "weg=$weg" >> "$GITHUB_OUTPUT"
          echo "Weg: $text"
          echo "**Klicktests – Weg:** $text" >> "$GITHUB_STEP_SUMMARY"

      - name: Code am Commit des PRs holen
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Auf die Vercel-Vorschau warten
        id: vorschau
        if: steps.weg.outputs.weg == 'vorschau'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$HEAD_SHA&per_page=100" \
              --jq '.[] | select(.production_environment != true and (.environment | test("^preview"; "i"))) | .id')
            for id in $ids; do
              status=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" \
                --jq '.[0] | [.state, (.environment_url // .target_url // "")] | @tsv')
              state=$(printf '%s' "$status" | cut -f1)
              url=$(printf '%s' "$status" | cut -f2)
              if [ "$state" = "success" ] && [ -n "$url" ]; then
                echo "Vorschau bereit: $url"
                echo "url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "::error::Die Vercel-Vorschau für $HEAD_SHA ist fehlgeschlagen ($state)."
                exit 1
              fi
            done
            echo "Vorschau noch nicht fertig – warte 15 s …"
            sleep 15
          done
          echo "::error::Keine Vercel-Vorschau – Autor nicht im Vercel-Team? Dann sollte der Selbstbau-Weg greifen. (Nach 10 Minuten keine erfolgreiche Vorschau für $HEAD_SHA.)"
          exit 1

      - name: Chromium für Playwright installieren
        run: pnpm exec playwright install --with-deps chromium

      # db:seed reads --env-file=.env.local; in CI the file is empty and
      # DATABASE_URL comes from the environment.
      - name: Leere .env.local anlegen
        run: touch .env.local

      # No --force and no input: a destructive schema change fails here
      # instead of being applied (those are class C, Franz does them).
      - name: Datenbank dev auf den Stand des PRs bringen
        timeout-minutes: 3
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: pnpm db:push < /dev/null

      - name: Testdaten in dev
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: pnpm db:seed

      - name: Klicktests gegen die Vorschau
        if: steps.weg.outputs.weg == 'vorschau'
        env:
          BASE_URL: ${{ steps.vorschau.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm e2e

      # Random per run, masked before it reaches the environment, never
      # printed.
      - name: Sitzungs-Geheimnis für den Selbstbau erzeugen
        if: steps.weg.outputs.weg == 'selbstbau'
        run: |
          secret=$(openssl rand -base64 32)
          echo "::add-mask::$secret"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"

      # VERCEL_ENV=preview + ENABLE_DEV_LOGIN=1: dev login as in the preview
      # (src/lib/dev-login.ts). Google login is not needed for the tests.
      - name: App selbst bauen
        if: steps.weg.outputs.weg == 'selbstbau'
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          VERCEL_ENV: preview
          ENABLE_DEV_LOGIN: "1"
        run: pnpm build

      # setsid: the server gets its own process group, so the stop step can
      # end pnpm and next together.
      - name: Selbst gebaute App auf Port 3100 starten
        if: steps.weg.outputs.weg == 'selbstbau'
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          AUTH_TRUST_HOST: "1"
          VERCEL_ENV: preview
          ENABLE_DEV_LOGIN: "1"
        run: |
          setsid pnpm start -p 3100 > "$RUNNER_TEMP/app.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/app.pid"
          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -s -o /dev/null --max-time 5 http://localhost:3100/login; then
              echo "App antwortet auf http://localhost:3100"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Die selbst gebaute App antwortet nach 60 s nicht auf http://localhost:3100."
          tail -n 50 "$RUNNER_TEMP/app.log"
          exit 1

      - name: Klicktests gegen die selbst gebaute App
        if: steps.weg.outputs.weg == 'selbstbau'
        env:
          BASE_URL: http://localhost:3100
        run: pnpm e2e

      - name: Selbst gebaute App beenden
        if: always() && steps.weg.outputs.weg == 'selbstbau'
        run: |
          if [ -f "$RUNNER_TEMP/app.pid" ]; then
            kill -- "-$(cat "$RUNNER_TEMP/app.pid")" 2>/dev/null || true
          fi

      - name: Bericht und Screenshots hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: |
            playwright-report/
            test-results/
          retention-days: 7
