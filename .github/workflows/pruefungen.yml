name: Prüfungen

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pruefungen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruefungen:
    name: Prüfungen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders only: the build does not connect to a database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-platzhalter
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      # PageProps/LayoutProps live in .next/types, which a fresh checkout lacks.
      - name: Routen-Typen erzeugen
        run: pnpm exec next typegen

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build
